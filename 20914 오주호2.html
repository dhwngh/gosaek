<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>슈퍼 고색고 월드 (Super Gosaekgo World)</title>
    <style>
        /* 폰트 로드: 영문 전용 픽셀 폰트와 한글 전용 레트로 도트 폰트 */
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        @import url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff');

        /* 📺 8비트 마리오 월드 스테이지 배경 및 전체 화면 고정 */
        body {
            margin: 0;
            padding: 0;
            background-color: #5c94fc; /* 오리지널 마리오 하늘색 */
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 16px 16px;
            font-family: 'DungGeunMo', 'Press Start 2P', cursive, sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* 🖥️ 한 화면에 모두 볼 수 있도록 스크롤 원천 차단 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 30px 20px;
            color: #ffffff;
            image-rendering: pixelated;
        }

        /* ☁️ 배경용 도트 구름 애니메이션 이펙트 */
        body::before {
            content: "☁️    ☁️☁️    ☁️            ☁️☁️";
            position: fixed;
            top: 100px;
            left: -100px;
            font-size: 3rem;
            opacity: 0.25;
            letter-spacing: 150px;
            white-space: nowrap;
            animation: cloudMove 60s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes cloudMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(100vw); }
        }

        /* 👑 상단 전광판 스코어보드 디자인 */
        header {
            text-align: center;
            z-index: 10;
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header h1 {
            font-family: 'Press Start 2P', 'DungGeunMo', sans-serif;
            font-size: 2.2rem;
            color: #f1c40f; /* 황금 코인 색상 */
            text-shadow: 5px 5px 0px #000;
            margin: 0 0 12px 0;
            letter-spacing: -1px;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            width: 80%;
            font-size: 1.1rem;
            text-shadow: 3px 3px 0px #000;
            border-bottom: 4px dashed #000;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .score-board span { color: #ffffff; }
        .score-board em { color: #ff4d4d; font-style: normal; }

        /* 🧱 [수정] 한 행에 4개씩 정확히 떨어지도록 최대 가로폭 지정 */
        .arcade-stage {
            position: relative;
            width: 100%;
            max-width: 420px; /* PC화면에서 기본 4개 배치를 강제하여 행 단위 컬러 유지 */
            display: flex;
            flex-wrap: wrap; 
            justify-content: center;
            align-content: center;
            gap: 16px 18px; 
            padding: 10px;
            margin: auto 0;
            z-index: 2;
        }

        /* 화면이 넓은 PC 환경에서는 한 줄에 더 여유롭게 배치되도록 조절 */
        @media (min-width: 768px) {
            .arcade-stage {
                max-width: 450px;
                gap: 20px 22px;
            }
        }

        /* 🍄 미스터리 아이템 노드 공통 디자인 */
        .pixel-item {
            width: 80px;
            height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            box-sizing: border-box;
            transition: all 0.15s steps(4);
            cursor: pointer;
            border: 4px solid #000; /* 두꺼운 도트 아웃라인 */
        }

        .pixel-item .p-date {
            font-size: 0.65rem;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 4px;
            text-shadow: 2px 2px 0px #000;
        }

        .pixel-item .p-num {
            font-size: 1rem;
            font-weight: bold;
            color: #ffff00;
            text-shadow: 2px 2px 0px #000;
        }

        /* 💬 마우스 올릴 때 상단에 펼쳐지는 도트 말풍선 설명창 */
        .pixel-item::after {
            content: attr(data-title);
            position: absolute;
            top: -55px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background-color: #ffffff;
            color: #000000;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: bold;
            white-space: nowrap;
            border: 3px solid #000;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.2);
            opacity: 0;
            transition: transform 0.1s ease, opacity 0.1s ease;
            z-index: 10;
            pointer-events: none;
        }

        /* 🔥 호버 이펙트: 마리오 점프하듯 위로 일제히 통 튀어오르기 */
        .pixel-item:hover {
            transform: scale(1.15) translateY(-10px);
            box-shadow: 0px 8px 0px #000, 0px 12px 15px rgba(0,0,0,0.4);
            z-index: 5;
        }

        .pixel-item:hover::after {
            transform: translateX(-50%) scale(1);
            opacity: 1;
            top: -60px;
        }

        /* 🎨 레트로 테마 컬러 스타일 정의 */
        .rb-red     { background: #ff3838; box-shadow: inset -6px -6px 0px #cf1b1b, 4px 4px 0px rgba(0,0,0,0.3); } 
        .rb-orange  { background: #ff9f43; box-shadow: inset -6px -6px 0px #ee7f1a, 4px 4px 0px rgba(0,0,0,0.3); } 
        .rb-yellow  { background: #feca57; box-shadow: inset -6px -6px 0px #e1a31b, 4px 4px 0px rgba(0,0,0,0.3); } 
        .rb-green   { background: #1dd1a1; box-shadow: inset -6px -6px 0px #10ac84, 4px 4px 0px rgba(0,0,0,0.3); } 
        .rb-blue    { background: #2e86de; box-shadow: inset -6px -6px 0px #1d6fa5, 4px 4px 0px rgba(0,0,0,0.3); } 
        .rb-star    { background: #f1c40f; box-shadow: inset -6px -6px 0px #f39c12, 4px 4px 0px rgba(0,0,0,0.3); border-color: #fff #000 #000 #fff; } 

        /* 🟫 최하단 마리오 격자무늬 지상 바닥 */
        .ground-floor {
            width: 100vw;
            height: 50px;
            background-color: #d35400;
            background-image:
                linear-gradient(90deg, #a04000 4px, transparent 4px),
                linear-gradient(#a04000 4px, transparent 4px),
                linear-gradient(90deg, rgba(255,255,255,0.3) 2px, transparent 2px),
                linear-gradient(rgba(255,255,255,0.3) 2px, transparent 2px);
            background-size: 20px 20px;
            background-position: 0 0, 0 0, 2px 2px, 2px 2px;
            border-top: 6px solid #4a2700;
            z-index: 4;
            position: fixed;
            bottom: 0;
            left: 0;
        }

    </style>
